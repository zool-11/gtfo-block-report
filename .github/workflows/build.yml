name: Build Mod
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug list files
        run: |
          pwd
          ls -la
          ls -la lib/

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0'

      - name: Build
        run: dotnet build BlockReport.csproj --configuration Release

      - name: Upload dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModDll
          path: bin/Release/netstandard2.1/BlockPlayerStatusReport.dll
