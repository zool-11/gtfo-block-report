name: Build Mod
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0'

      - name: Build Release
        run: dotnet build BlockReport.csproj --configuration Release

      - name: Upload built mod dll
        uses: actions/upload-artifact@v4
        with:
          name: ModDll
          path: bin/Release/netstandard2.1/BlockPlayerStatusReport.dll
